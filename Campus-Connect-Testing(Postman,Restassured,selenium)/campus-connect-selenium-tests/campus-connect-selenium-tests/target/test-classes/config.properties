# ============================================================
# Test configuration. Any value here can be overridden from the
# command line with -D, e.g.  mvn test -Dbase.url=http://localhost:4300
# ============================================================

# Where the Angular app is served. Default Angular dev server port is 4200.
base.url=http://localhost:4200

# chrome | firefox | edge
browser=chrome

# Run the browser without a visible window (useful for CI). true | false
headless=false

# Seconds to wait for elements / conditions before failing.
explicit.wait.seconds=15
